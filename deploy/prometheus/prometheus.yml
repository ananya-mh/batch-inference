# Prometheus config for docker compose: scrapes the batch inference server.
global:
  # Every second, so short runs (like the fairness experiment) show busy
  # workers and queue depth in detail. Fine for local use; production would
  # usually scrape every 15 to 30 seconds.
  scrape_interval: 1s
  evaluation_interval: 15s

scrape_configs:
  - job_name: batch-inference
    static_configs:
      - targets: ["server:8080"]
