# Runs the whole system locally: `docker compose up`.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: batch
    ports:
      # Exposed so `go test` on the host can create its test databases here.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d batch"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/batch?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      # Wait until Postgres accepts connections, not just until it starts.
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
