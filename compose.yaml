# Runs the whole system locally: `docker compose up`.

services:
  postgres:
    image: postgres:17
    # The default of 100 connections is too few when `go test ./...` runs
    # many database tests at once, each with its own small pool.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: batch
    ports:
      # Exposed so `go test` on the host can create its test databases here.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d batch"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build: .
    # Both services share this image, so it is built only once.
    image: batch-inference:dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/batch?sslmode=disable
      HTTP_ADDR: ":8080"
      MAX_UPLOAD_BYTES: "104857600" # 100 MB
      # Completion windows clients may ask for. Add a short one like 30s to
      # try expiry by hand.
      COMPLETION_WINDOWS: "24h"
      # Development tenants and keys only. Real keys never go in this file.
      SEED_TENANTS: tenant_a=sk-dev-tenant-a,tenant_b=sk-dev-tenant-b,tenant_c=sk-dev-tenant-c,tenant_d=sk-dev-tenant-d
      # Where requests are sent: the fake model here, vLLM for the GPU check.
      MODEL_BASE_URL: http://fakemodel:8000/v1
      WORKERS: "16"
      SCHEDULER_WINDOW: "32"
      MAX_ATTEMPTS: "5"
      JOB_TIMEOUT: 2m
    ports:
      - "8080:8080"
    depends_on:
      # Wait until Postgres accepts connections, not just until it starts.
      postgres:
        condition: service_healthy
      fakemodel:
        condition: service_started
    restart: unless-stopped

  # Pretend AI model, so no GPU is needed. Tune its behavior with the
  # FAKE_MODEL_* variables (see internal/fakemodel/config.go).
  fakemodel:
    image: batch-inference:dev
    entrypoint: ["/fakemodel"]
    environment:
      FAKE_MODEL_MIN_DELAY: 50ms
      FAKE_MODEL_MAX_DELAY: 500ms
      FAKE_MODEL_OUTPUT_WORDS: "20"
      FAKE_MODEL_ERROR_RATE: "0.02"
      FAKE_MODEL_CRASH_RATE: "0.01"
      # Set a seed for repeatable runs (the experiment does). Unset means
      # truly random.
      FAKE_MODEL_SEED: ${FAKE_MODEL_SEED:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres-data:
